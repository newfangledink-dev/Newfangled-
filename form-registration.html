<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Form registration — Newfangled Ink</title>
<meta name="robots" content="noindex, nofollow" />
</head>
<body>
<!--
  This page exists only so Netlify's build bot can register the consultation form.
  Visitors never see it. The real form lives on contact.html and posts here by name.
  Do not delete, and keep the field names identical to the live form.
-->
<form name="consultation" data-netlify="true" netlify-honeypot="bot-field" enctype="multipart/form-data" hidden="">
  <input type="hidden" name="form-name" value="consultation" />
  <input type="text" name="bot-field" />
  <input type="text" name="Name" />
  <input type="email" name="Email" />
  <input type="tel" name="Phone" />
  <textarea name="Tattoo idea"></textarea>
  <input type="text" name="Placement" />
  <input type="text" name="Approximate size" />
  <input type="text" name="Style" />
  <input type="text" name="Preferred date" />
  <input type="text" name="Preferred time" />
  <textarea name="Additional details"></textarea>
  <input type="file" name="Reference 1" />
  <input type="file" name="Reference 2" />
  <input type="file" name="Reference 3" />
</form>
</body>
</html>
